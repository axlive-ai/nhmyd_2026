name: Deploy Pages
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: project
      - run: npm run build
        working-directory: project
      - name: Assemble Pages site (repo root + com/ + accessibility/ + project/ 정적 리소스 전체)
        run: |
          mkdir -p site/project
          cp index.html site/
          cp -r com site/com
          cp -r accessibility site/accessibility
          # project/ 밑의 레거시 정적 리소스(css, js, images, fonts, html, cms, email,
          # event, terms, pub 등)는 pub/**/*.html이 전부 project/ 기준 상대경로
          # (예: ../css/xxx.css)로 참조하고 있어서, pub/만 배포하면 css/js/images가
          # 전부 404가 난다. node_modules/src/빌드 툴링 파일만 제외하고 project/ 전체를
          # 그대로 복사해서 원래 상대경로 구조를 그대로 유지한다.
          rsync -a \
            --exclude 'node_modules' \
            --exclude 'src' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'gulpfile.js' \
            --exclude '.nvmrc' \
            project/ site/project/
          # 커스텀 도메인(CNAME)은 배포 아티팩트의 루트에 있어야 GitHub Pages가 인식한다.
          # project/pub/CNAME(gulp copyCname 태스크가 src/CNAME에서 복사한 파일)을
          # site/(아티팩트 루트)로 옮겨 site/project/pub/CNAME 대신 site/CNAME이 되게 한다.
          cp project/pub/CNAME site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
