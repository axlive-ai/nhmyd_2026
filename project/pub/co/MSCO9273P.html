<body>
	<div class="wrapper nhasset">
		<!-- header -->
		<div class="header">
			<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
			<h1><a href="javascript:;" role="text">통합메인</a></h1>
			<!-- <a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
			<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>  -->
		</div>
		<!-- //header -->
	
		<!-- container -->
		<div class="container"> 
			<button type="button" onclick="slidePopConfirm()">팝업</button>
		</div>
		<!-- // container -->

		<!-- 컨펌 팝업 -->
		<div class="nhasset popWrap slidePopConfirm">
			<div class="dim"></div>
			<div class="popInner titMini">
				<h1><span class="blind">큰글모드 설정 팝업</span></h1>
				<div class="popCont pb0">
					<div class="popEventTxtBox">
						<span class="defTit"><strong>메인화면 등 일부서비스에서<br>큰글씨로 볼 수 있어요.</strong></span>
					</div>
					<div class="bigTxtImgWrap type01"> <!-- type01 : 큰글모드, type02 : 일반모드 -->
					</div>
				</div>
				<div class="popBtnWrap">
					<div class="popBtn">
						<a href="javascript:;" class="" onclick="popClose(this);return false;" role="button">아니오</a>
						<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">네 좋아요</a>
					</div>
					<!-- <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a> -->
				</div>
			</div>
		</div>
		<!-- //컨펌 팝업 -->
	</div>
