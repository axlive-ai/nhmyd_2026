<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NH Bank">
<meta name="format-detection" content="telephone=no">
<link rel="shortcut icon" href="#">
<title>자산연결안내(팝업)</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
<script type="text/javascript">
$(function(){
    slidePopConfirm();
});
</script>
</head>
<body>
	<div class="wrapper nhasset">
		<!-- header -->
		<div class="header">
			<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
			<h1><a href="javascript:;" role="text">자산연결안내(팝업)</a></h1>
			<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
			<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a> <!-- [2022-12-29] 접근성 .blind 삭제 -->
		</div>
		<!-- //header -->
	
		<!-- container -->
		<div class="container"> 
			<button type="button" onClick="slidePopConfirm()">팝업열기</button>
		</div>
		<!-- // container -->

		<!-- 컨펌 팝업 -->
		<div class="nhasset popWrap slidePopConfirm">
			<div class="dim"></div>
			<div class="popInner">
				<h1>자산 연결 안내</h1>
				<div class="popCont">
					<div class="assetConnectInfo">
                        <div class="assetConnEmpty">
                            <strong>신탁/ISA를 확인하려면</br>
							자산 (재)연결이 필요해요</strong>
                        </div>
					</div>
					
				</div>
		
				<div class="popBtnWrap">
					<div class="popBtn">
                        <a href="javascript:;" class="" onclick="popClose(this);return false;" role="button">안볼래요</a>
						<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">연결하러가기</a>
					</div>
					<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
                </div>
                
			</div>
		</div>
		<!-- //컨펌 팝업 -->
	</div>

</body>
</body>
</html>
