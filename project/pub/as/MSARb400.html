<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">

<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>그때 그랬다면</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
	<div class="wrapper nhasset">
		<!-- header -->
		<div class="header">
			<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
			<h1><a href="javascript:;" role="text">그때 그랬다면</a></h1>
			<!-- <a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
			<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>  -->
		</div>
		<!-- //header -->
	
		<!-- container -->
		<div class="container">
			<div class="maybeOther">
				<span class="step">STEP 1</span>
				<p>그때 다른데<strong>투자했으면 어땠을까?</strong></p>
			</div>
			<div class="boxTypeWrap">
				<ul class="maybeOtherList">
					<li><a href="javascript:;">그때 차를 바꾸지 않았더라면?</a></li>
					<li><a href="javascript:;">명품백을 사지 않았더라면?</a></li>
					<li><a href="javascript:;">주식 투자를 하지 않았더라면?</a></li>
					<li><a href="javascript:;">유럽여행을 가지 않았더라면?</a></li>
					<li>
						<a href="javascript:;" class="directInputBtn">직접입력할께요</a>
						<div class="directInputArea" style="display:none">
							<div class="inputList">
								<input type="text" class="inputDirect" title="직접입력" value="" placeholder="최대 15자까지 입력 가능합니다.">
								<a href="javascript:;" role="button" class="edit">수정</span>
								<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
							</div>
							<div class="mt10 ar"><a href="javascript:;" class="contBtn02 green">입력완료</a></div>
						</div>
					</li>
				</ul>
			</div>
			<div class="areaBtnDefault">
				<a href="javascript:;" class="btnPressDefault" role="button">다시하기</a>
				<a href="javascript:;" class="btnPressPoint" role="button">확인</a>
			</div>

		</div>
		<!-- //container -->
	</div>

<script type="text/javascript">
	$('.directInputBtn').click(function(){
		$(this).hide();
		$(this).next('.directInputArea').show().find('input').focus();
	});
	$('.inputList .edit').click(function(){
		$(this).siblings('input').focus();
	});

	$('.inputDirect').on('focusout',function(e){
		var $this = $(this).val();
		if ($this < 1) {
			$(this).next('.edit').hide()
		}else{
			$(this).next('.edit').show()
		}
	});
</script>
</body>
</html>
