            <script>
                $(function () {
                    var swiper = new Swiper('.bannerSwiperGoal', {
                        slidesPerView: "auto",
                        spaceBetween: 10,
                        // loop: true,
						centerSlides:true,
                        // autoplay: {
                        //     delay: 2500,
                        //     disableOnInteraction: true,
                        //     pauseOnMouseEnter: true,
                        // },

                        pagination: {
                            el: '.swiper-pagination',
                            type: 'bullets',
                            clickable: true,
                        },
                        on: {
                            transitionEnd: function () {
                                $('.swiper-slide').attr('aria-hidden', 'true')
                                $('.swiper-slide-active').attr('aria-hidden', 'false')
                            }
                        }
                    });
                    $('.bannerSwiperGoal').find('.stopBtn').on('click', function () {
                        $('.swiper-autoBtn').removeClass('playing');
                        swiper.autoplay.stop();
                        console.log('자동재생 멈춤');
                    })
                    $('.bannerSwiperGoal').find('.playBtn').on('click', function () {
                        $('.swiper-autoBtn').addClass('playing');

                        swiper.autoplay.start();
                        console.log('자동재생 시작');
                    })
                })
            </script>
