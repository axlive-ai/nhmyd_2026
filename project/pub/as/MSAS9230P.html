    $(function(){
        fullLayerPop();
    })
</script>
</head>
<body>
	<div class="wrapper nhasset">
		<!-- header -->
		<div class="header">
			<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
            <h1><a href="javascript:;" role="text">기타 관리</a></h1>
            <a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
			<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a> <!-- [2022-12-29] 접근성 .blind 삭제 -->
		</div>
		<!-- //header -->
	
		<!-- container -->
		<div class="container">
			
		</div>
        <!-- //container -->
        
        <div class="nhasset popWrap fullLayerPop">
            <div class="popInner">
                <h1>기타 관리</h1>
                <div class="popCont">
                    <!-- <div class="infoBox">
                        <ul class="detailList">
                            <li>
                                <span class="tit">등록일</span>
                                <span class="value">2020.07.31</span>
                            </li>
                        </ul>
                    </div> -->
        
                    <div class="formWrap realAsset"> <!--10.25 realAsset 추가-->
                        <ul>
                            <li>
                                <strong class="formTit">명칭</strong>
                                <div class="inputList">
                                    <input type="text" title="명칭" value="프라다백" placeholder="명칭을 입력해주세요."> 
                                    <a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
                                </div>
                                <p class="errorTxt">특수문자[!@#$*()-=|;:,./]만 입력 가능합니다.</p>
                            </li> 
                            <li>
                                <strong class="formTit">보유금액</strong>
                                <div class="inputList unitMan"> 
                                    <input type="tel" title="보유금액" value="10,000" placeholder="금액을 입력해주세요.">
                                    <span class="unit">만원</span>
                                    <a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
                                </div>
								<!-- [2021-08-06] 한은정 : 금액입력버튼 수정, 에러 텍스트 추가// -->
								<div class="roundBtnWrap">
									<a href="javascript:;" role="button" title="10만원 추가">+10만</a>
									<a href="javascript:;" role="button" title="50만원 추가">+50만</a>
									<a href="javascript:;" role="button" title="100만원 추가">+100만</a>
									<a href="javascript:;" role="button" title="300만원 추가">+300만</a>
								</div>
								<p class="errorTxt">1부터 9,999,999만원까지 입력 가능합니다.</p>
								<!-- //[2021-08-06] 한은정 : 금액입력버튼 수정, 에러 텍스트 추가 -->
                            </li> 
                        </ul>
                    </div>
                    <div class="grayBgLine mt30">
                        <ul class="detailList">
                            <li>
                                <span class="tit">등록일</span>
                                <span class="value">2020.07.31</span>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn">
						<a href="javascript:;" class="" role="button">삭제</a> 
						<a href="javascript:;" class="confirmBtn" role="button">확인</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
                </div>
            </div>
        </div>
	</div>
