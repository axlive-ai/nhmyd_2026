<title>자산관리 - 자산현황</title>
<script src="../pub-assets/js/head.js"></script>
<script> 
	$(function(){
		fullLayerPop();
	})
</script>

<body>
	<div class="wrapper nhasset">
		<!-- header -->
		<div class="header">
			<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
			<h1><a href="javascript:;" role="text">금 등록</a></h1> 
			<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
			<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a> <!-- [2022-12-29] 접근성 .blind 삭제 -->
		</div>
		<!-- //header -->
	
		<!-- container -->
		<div class="container bgWhite">
			<div class="formWrap realAsset"> <!--10.25 realAsset 추가-->
				<ul>
					<li>
						<strong class="formTit">명칭</strong>
						<div class="inputList">
							<input type="text" title="명칭" value="결혼예물" placeholder="명칭을 입력해주세요.">
							<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
						</div>
						<div class="roundChkWrap flexType mt10">
							<ul>
								<li>
									<span class="roundChk">
										<input type="radio" name="sample00" id="sample01">
										<label for="sample01">재테크</label>
									</span>
								</li>
								<li>
									<span class="roundChk">
										<input type="radio" name="sample00" id="sample02">
										<label for="sample02">돌잔치</label>
									</span>
								</li>
								<li>
									<span class="roundChk">
										<input type="radio" name="sample00" id="sample03" checked="checked">
										<label for="sample03">결혼예물</label>
									</span>
								</li>
								<li>
									<span class="roundChk">
										<input type="radio" name="sample00" id="sample04">
										<label for="sample04">모임</label>
									</span>
								</li>
							</ul>
						</div>
						<p class="errorTxt">특수문자[!@#$*()-=|;:,./]만 입력 가능합니다.</p>
					</li>
					<li>
						<strong class="formTit">금 단위</strong>
						<div class="boxRadio">
							<div class="boxRadioInn">
								<span>
									<input name="rdo01" id="rdo01" type="radio" checked="checked">
									<label for="rdo01">그램(g)</label>
								</span>
							</div>
							<div class="boxRadioInn">
								<span>
									<input name="rdo01" id="rdo03" type="radio">
									<label for="rdo03">돈</label>
								</span>
							</div>
						</div>
					</li>
					<li>
						<strong class="formTit">보유량<em class="inputVal">(총 1.875g)</em></strong>
						<div class="inputList">
							<input type="tel" title="보유량" placeholder="보유량을 입력해주세요.">
							<span class="unit">g</span>
							<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
						</div>
						<p class="errorTxt">0보다 큰 숫자만 입력 가능합니다.</p>
					</li>

					<li>
						<strong class="formTit">총 구매가(선택)<em class="inputVal">(1g = 70,345원)</em></strong>
						<div class="inputList">
							<input type="tel" title="총 구매가(선택)" value="" placeholder="금액을 입력해주세요.">
							<span class="unit">원</span>
							<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
						</div>
						<p class="errorTxt">1부터 999,999,999,999까지 입력 가능합니다.</p>
					</li>
				</ul>

			</div>
			<div class="grayBgLine mt30">
				<ul class="detailList">
					<li>
						<span class="tit">시세적용금액은 자산현황에서 확인하실 수 있습니다.</span>
					</li>
				</ul>
			</div>
			<div class="areaBtnDefault">
				<a href="javascript:;" class="btnPressPoint" role="button">등록하기</a>
			</div>
		</div>
		<!-- //container -->
		

	</div>

</body>
</html>
