<script type="text/javascript">
	$('.layerMsgClose').click(function(){
		$(this).closest('.layerMsgWrap').hide();
	});

	var $toggleBtn = $(".toggleBtn"),
		$toggleWrap = $(".toggleWrap"),
		$toggleCont = $(".toggleCont"),
		$toggleTxt = $(".toggleTxt03");

		$toggleBtn.click(function(){
		 if ($(this).closest($toggleWrap).find( $toggleCont).css("display") == "block"){
			$(this).parents().closest($toggleWrap).find($toggleTxt).text("상세정보 보기");
		 }else{
			$(this).parents().closest($toggleWrap).find($toggleTxt).text("접기");
		 }
	});

</script>
