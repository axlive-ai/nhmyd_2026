<script src="../pub-assets/js/head.js"></script>

<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1><a href="javascript:;" role="text">보험 상세</a></h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 피보험자 보험 상세_보험업권외화(물/일반보험) ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [상단영역] 보험정보 -->
		<!-- -------------------------------------- -->
		<div class="boxWrapShadow">
			<!-- ### [계좌정보] 기본내용 ### -->
			<div class="boxTypeWrap delShadow">
				<!-- // -->
				<div class="accTopInfo mt0">
					<h2 class="accName">$내 자산 별명$
						<img src="../../images/logos/AAAR0000.png" alt="삼성생명보험㈜ 로고" class="imgLogo">
					</h2>
					<div class="wrapTag">
						<span class="type01 radius4">#갱신형</span>
					</div>
				</div>
				<!-- // -->
				<hr class="divLine">
				<!-- // -->
				<div class="accInfoDetail">
					<ul class="detailList">
						<li>
							<span class="tit">유형</span>
							<span class="value">$보험 유형$</span>
						</li>
						<li>
							<span class="tit">피보험자</span>
							<span class="value">본인</span>
						</li>
						<li>
							<span class="tit">목적물수</span>
							<span class="value">20건
								<button type="button" class="contBtnArrow" aria-haspopup="true">목적물상세</button>
							</span>
						</li>
						<li>
							<span class="tit">보장내역</span>
							<span class="value">10건
								<button type="button" class="contBtnArrow" aria-haspopup="true">나의 보장내역 상세</button>
							</span>
						</li>
						<li>
							<span class="tit">특약정보</span>
							<span class="value">20건
								<button type="button" class="contBtnArrow" aria-haspopup="true">특약 상세</button>
							</span>
						</li>
						<li>
							<span class="tit">상품명</span>
							<span class="value">삼성생명 종합건강보험1.0(무배당)일당백_2종_표준체</span>
						</li>
					</ul>
				</div>
				<!-- // -->
			</div>

			<!-- ### [토글영역] 상세정보 ### -->
			<div class="moreInfoArea">
				<div class="moreInfoWrap toggleWrap">
					<div class="moreInfo toggleCont" style="display:none">
						<hr class="divLine2" aria-hidden="true">
						<ul class="detailList">
							<li>
								<span class="tit">증권번호</span>
								<span class="value">03580204123456 <button type="button" class="contBtn01" title="증권번호 복사">복사</button></span>
							</li>
							<li>
								<span class="tit">계약상태</span>
								<span class="value">정상</span>
							</li>
							<li>
								<span class="tit">계약일자</span>
								<span class="value">2020.07.21</span>
							</li>
							<li>
								<span class="tit">만기일자</span>
								<span class="value">2027.01.01</span>
							</li>
							<li>
								<span class="tit">보험가입금액(USD) </span>
								<span class="value"><strong class="dataValue">1,000</strong></span>
							</li>
						</ul>
					</div>
					<button type="button" class="moreOpenBtn toggleBtn"><span class="toggleTxt07">상세정보 보기</span></button>
				</div>
			</div>
			<!-- ### // ### -->
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>

</html>
