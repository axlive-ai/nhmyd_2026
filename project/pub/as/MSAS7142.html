<body>
	<div class="wrapper nhasset">

			<h1><a href="javascript:;" role="text">보험 상세</a></h1> <!-- [한은정 : 2021-05-07] 타이틀 변경 -->

			<div class="boxWrapShadow"><!--09.02 boxWrapShadow 추가 s:boxWrapShadow-->

						</dl> -->

						</div>
					</div>
					<!-- // 상단 계좌정보 영역 -->

					<!-- [2021-10-05] 한은정 수정// -->
					<!-- 보장내역 없을 경우 -->
					<!-- <hr class="divLine"> -->

					<!-- 보장내역 있을 경우 09.22 미확정으로 미노출
					<div class="statusWrap addTpye">
						<a href="javascript:;" class="link">
							<span class="statusTit">이 상품의 보장내역을 알아볼까요?</span>
						</a>
					</div>
					// 09.22 미확정으로 미노출 -->
					<hr class="divLine"><!--09.26 추가-->
					<!-- 계좌정보 상세 -->
					<div class="accInfoDetail">
						<ul class="detailList">
							<li>
								<span class="tit">유형</span>
								<span class="value">
									자동차보험&gt;종합보장보험
								</span>
							</li>
							<li>
								<span class="tit">상품명</span>

									<!-- <button type="button" class="contBtn01" title="별칭 수정">수정</button> -->

							</li>
							<li><!--10.20 추가-->
								<span class="tit">보장내역</span>
								<span class="value">10건

							</li>
						</ul>
					</div>
					<!-- // 계좌정보 상세 -->
				</div>
				<!--e:delShadow-->

				<div class="moreInfoArea"><!--09.02 div moreInfoArea 추가  및 이동 s:moreInfoArea-->
					<!-- 추가정보 열/닫 -->
					<div class="moreInfoWrap toggleWrap">
							
						<div class="moreInfo toggleCont" style="display:none">
							<hr class="divLine2" aria-hidden="true">
							<ul class="detailList">
								<li>
									<span class="tit">증권번호</span>
									<span class="value">03580204123456 <button type="button" class="contBtn01" title="계좌번호 복사">복사</button></span></span>
								</li>
								<li>
									<span class="tit">보험기간</span>
									<span class="value">2017.01.01~2027.12.31</span>
								</li>
								<li>
									<span class="tit">연령특약</span>
									<span class="value">만35세 이상</span>
								</li>
								<li>
									<span class="tit">운전자한정특약</span>
									<span class="value">기피보험자 1인</span>

								<li>

									<span class="value">가입</span>
								</li>
								<li>

							</ul>
						</div>
						<button type="button" class="moreOpenBtn toggleBtn"><span class="toggleTxt07">상세정보 보기</span></button> <!--09.21 toggleTxt07 수정-->
					</div>
					<!-- // 추가정보 열/닫 -->
				</div>
				<!--e:moreInfoArea-->
			</div>
			<!--e:boxWrapShadow-->
		</div>
		<!-- //container -->

	</div>
<script type="text/javascript">

	var $toggleBtn = $(".toggleBtn"),
		$toggleWrap = $(".toggleWrap"),
		$toggleCont = $(".toggleCont"),
		$toggleTxt = $(".toggleTxt03");

		$toggleBtn.click(function(){
			if ($(this).closest($toggleWrap).find( $toggleCont).css("display") == "block"){
			$(this).parents().closest($toggleWrap).find($toggleTxt).text("상세정보 보기");
			}else{
			$(this).parents().closest($toggleWrap).find($toggleTxt).text("접기");
			}
	});
</script>
</body>
</html>
