<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>자산관리 - 자산현황</title>
<script src="../pub-assets/js/head.js"></script>
<script> 
	$(function(){
		fullLayerPop();
	})
</script>
</head>
<body>
	<div class="wrapper nhasset">
			<!-- header -->
			<div class="header">
				<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
				<h1><a href="javascript:;" role="text">기타 등록</a></h1> 
				<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
				<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a> <!-- [2022-12-29] 접근성 .blind 삭제 -->
			</div>
			<!-- //header -->
	
		<!-- container -->
		<div class="container bgWhite">
			<div class="formWrap estWrap">
				<ul>
					<li>
						<strong class="formTit">명칭</strong>
						<div class="inputList">
							<input type="text" title="명칭" value="명칭을 입력해주세요." placeholder="명칭을 입력해주세요.">
							<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
						</div>
						<p class="errorTxt">특수문자[!@#$*()-=|;:,./]만 입력 가능합니다.</p>
					</li>
					<li>
						<strong class="formTit">보유금액
						</strong>
						<div class="inputList unitMan"> <!-- [2021] .unitMan 추가 -->
							<input type="tel" title="보유금액" value="" placeholder="금액을 입력해주세요.">
							<span class="unit">만원</span>
							<a href="javascript:" class="btnReset" role="button" style="display: inline;">입력내용삭제</a>
						</div>
						<div class="roundBtnWrap">
							<a href="javascript:;" role="button" title="100만원 추가">+100만</a>
							<a href="javascript:;" role="button" title="1,000만원 추가">+1,000만</a>
							<a href="javascript:;" role="button" title="1억 추가">+1억</a>
							<a href="javascript:;" role="button" title="10억 추가">+10억</a>
						</div>
						<p class="errorTxt">1부터 9,999,999만원까지 입력 가능합니다.</p>
						<!-- //[2021-08-06] 한은정 : 금액입력버튼 수정, 에러 텍스트 추가 -->
					</li>
				</ul>
			</div>
			 <div class="areaBtnDefault">
				<a href="javascript:;" class="btnPressPoint" role="button">등록하기</a>
			</div>
		</div>
		<!-- //container -->
		
		

	</div>

</body>
</html>
