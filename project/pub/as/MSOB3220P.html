<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>자산관리 - 추천목표</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function () {
		fullLayerPop();
	})
</script>
</head>
<body>
	<div class="wrapper nhasset">
		<!-- header -->
		<div class="header">
			<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
			<h1><a href="javascript:;" role="text">추천목표</a></h1>
			<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
			<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a> <!-- [2022-12-29] 접근성 .blind 삭제 -->
		</div>
		<!-- //header -->
	
		<!-- container -->
		<div class="container">
			

		</div>
		<!-- //container -->

		<!-- 팝업시작 -->
		<div class="nhasset popWrap fullLayerPop">
			<div class="popInner">
				<h1>추천목표</h1>
				<div class="popCont grayPop">
                    <div class="totalBalance obpopTit">
                        <p class="defTxt">
                            잠깐만요!<br />매일매일 모아드릴게요!
                        </p>
                    </div>
					<!-- [2022-12-28] 마크업 수정 -->
                    <div class="boxTypeWrap bgType02 oblistbg02 addShadow">
                        <div class="visualSubWrap">
                            <h3 class="visualSub type01">챌린지 달성을 위한 추천상품
                                <div class="tooltipWrap">
                                    <button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">챌린지 달성을 위한 추천상품 안내툴팁</span></button>
                                    <div class="tooltipCont">
                                        <p>6개월 기간동안 자동으로 목표금액을 모아주는 논스톱 목표달성 기능입니다.</p>
                                        <button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">툴팁 닫기</span></button>
                                    </div>
                                </div>
                            </h3>
                            <p class="visualSubPara">상품가입 시 실제 금리와 다를 수 있습니다.</p>
                        </div>
                        <ul class="prodListWrap">
                            <li>
                                <a href="javascript:;"  role="button">
                                    <div class="prodRecomWrap">
                                        <strong class="prodTit">올원 5늘도 적금</strong>
                                        <em class="prodRecommInfo">최고(연/세전)</em>
                                        <div class="d-flex mt10">
                                            <div class="prodRecomVal">
                                                <span class="dataValueWrap">
                                                    <strong class="dataValue">2.85%</strong>
                                                </span>
                                            </div>
                                            <div class="prodVal">
                                                6개월 매일(토/공휴일)제외<br>소액자동이체 적금
                                            </div>
                                        </div>
                                    </div>

                                    <div class="prodInfoWrap totalBalance mt0 p0">
                                        <div class="hashWrap">
                                            <span class="hashTag">#사회초년생</span>
                                            <span class="hashTag">#직장인</span>
                                        </div>
                                    </div>
                                </a>
                            </li>
                        </ul>
                    </div>
                    <!-- //[2022-12-28] 마크업 수정 -->
                    <a href="javascript:;" class="linkType2 mt30 fr">기존계좌 연결하기</a> <!--10.07 fr추가--><!-- 23.01.25 bdn클래스 추가// -->
				</div>
                <div class="popBtnWrap">
                    <div class="popBtn">
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
                </div>
			</div>
		</div>
		<!-- 팝업끝 -->

	</div>

</body>
</html>
