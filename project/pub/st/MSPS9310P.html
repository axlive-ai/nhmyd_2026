<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NH Bank">
<meta name="format-detection" content="telephone=no">
<link rel="shortcut icon" href="#">
<title>popup</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
<script type="text/javascript">
$(function(){
    slidePopConfirm();
});
</script>
</head>
<body>
<!-- wrapper -->
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1><a href="javascript:;" role="text">자산연결</a></h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a> <!-- [2022-12-29] 접근성 .blind 삭제 -->
	</div>
	<!-- //header -->
	<!-- container -->
	<div class="container"> 
			
	</div>
	<!-- // container -->

	<div class="nhasset popWrap slidePopConfirm">
		<div class="dim"></div>
		<div class="popInner">
			<h1>안내</h1>
			<div class="popCont notiSlidePop template01">
				<div class="popNotice">
					<p class="tit">AJ셀카 내차 시세 서비스 일시 중단 안내</p>
					<p class="cont">AJ셀카 서버 교체에 따라 주말동안 내차 시세 서비스가 일시 중단됩니다. 서비스 이용에 불편을 드려 죄송합니다.</p>
					<div class="grayBox">
						<span>서비스 중지기간</span>
						<span class="date">2022.08.01 ~ 2022.08.31</span>
					</div>
				</div>
				<ul class="notiSlideBtns">
					<li>
						<span class="chkbtnWrap">
							<input type="checkbox" id="todayClose" class="chekTypeOther" name="" title="하루동안 팝업 닫힘">
							<label for="todayClose">하루동안 보지 않기</label>
						</span>
					</li>
					<li><a href="javascript:;" onclick="popClose(this);return false;" class="under"  title="해당 창을 닫습니다.">자세히보기</a></li>
				</ul>
			</div>
			<div class="popBtnWrap">
				<div class="popBtn">
					<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
				</div>
				<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
			</div>
		</div>
	</div>

</div>
</body>
</html>
