	<script>
		$(function(){
			if($('.lookAroundWrap').length > 0){
				if($('.areaBtnDefault').length > 0){ //가입하기 버튼 여부
					$('.container').css('padding-bottom','55px')
				}else{
					$('.container').css('padding-bottom','0')
				}
			}
			$(window).on('scroll', function(){
				var _scrollTop = $('html, body').scrollTop();
				var _header = $('.header h1').outerHeight();
				var _winHalf = $(window).height() / 2;
				var _sum = _scrollTop + _winHalf;
				$('.lookAroundWrap .section').each(function(){
					var _thisTop = $(this).offset().top;
					console.log('section offset : '+ _thisTop);
					console.log('scrolltop : '+ _scrollTop);
					console.log('header : '+ _header);
					if (_thisTop <= _sum) {
						var _this = $(this);
						if (!_this.hasClass('active')) {
							_this.addClass('active');
						}
					}
				})
			})
			
		})
	</script>
