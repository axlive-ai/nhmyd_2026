	<script>
			// var pArr = ['바볼랏상품권<br>볼랏상품권<br>볼랏상품', '2테니스 가방', '3NH포인트', '4골프 글로브']; //상품 4개인 경우
			// var pArr = ['1NH포인트', '2테니스<br>가방', '3NH<br>포인트', '4골프<br>글로브', '5바볼랏<br>상품권', '바볼랏상품권<br>볼랏상품권<br>볼랏상품']; //상품 6개인 경우
			var pArr = ['1NH포인트<br>ssss', '2테니스<br>가방', '3NH<br>포인트', '4골프<br>글로브', '바볼랏상품권<br>볼랏상품권<br>볼랏상품', '6바볼랏<br>상품권', '7바볼랏<br>상품권', '8바볼랏<br>상품권']; //상품 8개인 경우

			var present = 1; // 추첨해서 나온 경품번호를 넣어주세요
			
			var can = pArr.length;
			//선물 칸 범위 내에서의 랜덤
			// var $max = 360 / can - 5;
			// var $min = 0 + 5;
			var degC = 360 / can / 2; //한 칸 가운데정렬

			var $rrPan = $('.rrPan');
			$rrPan.addClass('s'+can); //판 이미지 변경을 위한 클래스 추가
			for (i = 0; i < can; i += 1) { //텍스트 li에 입력
				$rrPan.append('<li>'+pArr[i]+'</li>')
				var degLi = 360 / can * i + degC;
				$($rrPan).find('li:nth-child(' + ( i+1 ) + ')').css('transform','translateX(-50%) rotate('+degLi+'deg)')
			}

			function rrpanStart(){
				$('.startBtn').attr('disabled', true);
				//var degR = Math.floor(Math.random() * ($max - $min + 1)) + $min; //선물 칸 범위 내에서의 랜덤
				var presentLi = 3600 + (360 / can * (can - ( present - 1)) - degC); //선물의 판 각도(degC는 센터, degR은 랜덤)
				$rrPan.rotate({
					angle:0,
					animateTo:presentLi,
					easing: $.easing.esing,
					duration:6000,
					callback: function() {
						alert(pArr[present - 1] + pArr2[present - 1] + '당첨!'); //테스트용
					}
				});
				setTimeout(function(){
					$('.startBtn').attr('disabled', false);
				}, 6000)
			}
			
	</script>
