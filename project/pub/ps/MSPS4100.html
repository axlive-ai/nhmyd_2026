<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script>
	//샘플 : 업데이트 버튼 클릭시 모션 추가
	function uiUpdateMotion(el){
		var _txt = '업데이트';

		if($(el).find('> .iconUpdate').text() == '업데이트 중') tostpop('error');

		$(el).find('> .iconUpdate').addClass('ani').text('업데이트 중');

		setTimeout(function(){
			//업데이트 후 이벤트 샘플
			$(el).find('> .iconUpdate').removeClass('ani').text(_txt);
			tostpop();
		},4000)
	}

	//샘플 : 토스트팝업
	function tostpop(type){
		var $tostCont = '';
		if(type == 'error')  $tostCont = '<div class="tostpopupWrap" aria-live="assertive"><div class="tostMsg error">이미 업데이트가 진행중입니다.</div></div>'
		else $tostCont = '<div class="tostpopupWrap" aria-live="assertive"><div class="tostMsg">업데이트가 완료되었습니다.</div></div>';

		$('.container').after($tostCont);
		setTimeout(function(){
			$('.tostpopupWrap').remove();
		},4000)
	}
</script>
