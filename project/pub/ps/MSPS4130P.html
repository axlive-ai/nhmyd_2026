<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NH Bank">
<meta name="format-detection" content="telephone=no">
<link rel="shortcut icon" href="#">
<title>popup</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
<script type="text/javascript">
$(function(){
    slidePopConfirm();
});
</script>
</head>
<body>
	<div class="wrapper nhasset">
		<!-- header -->
		<div class="header">
			<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
			<h1><a href="javascript:;" role="text">삭제 진행</a></h1>
			<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
			<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a> <!-- [2022-12-29] 접근성 .blind 삭제 -->
		</div>
		<!-- //header -->
	
		<!-- container -->
		<div class="container"> 
			
		</div>
		<!-- // container -->

		<!-- 컨펌 팝업 -->
		<div class="nhasset popWrap slidePopConfirm">
			<div class="dim"></div>
			<div class="popInner">
				<h1>해제/삭제</h1>
				<div class="popCont">
					<div class="transfer">
						<p class="defSubTit2"><strong>자산정보를 <span class="pointColor">삭제</span> 하시겠습니까?</strong></p>
						<p class="subTxt">등록하신 자산 정보를 모두 삭제합니다.<br />NH마이데이터 서비스에서 제공하는 혜택에 제한이 발생할 수 있으며, 삭제 완료 시 복구가 불가합니다.</p>
						<div class="assetSelectLlistWrap">
							<div class="assetSelectLlistAll">
								<span>
									<input type="checkbox" id="listAll" class="chekTypeOther" name="">
									<label for="listAll">개인(신용)정보 삭제에 동의합니다.</label>
								</span>
							</div>
						</div>
					</div>
				</div>
		
				<div class="popBtnWrap">
					<style>
						.btnPressDefault{background:#666 !important}
					</style>
					<div class="popBtn"><!-- 해제 진행에서 출력된 경우-->
						<a href="javascript:;" class="btnPressDefault" onclick="popClose(this);return false;" role="button">해제만 진행</a>
						<a href="javascript:;" class="" onclick="popClose(this);return false;" role="button">삭제</a><!-- 동의클래스 confirmBtn -->
					</div>
					<div class="popBtn"><!-- 삭제 버튼을 눌러 출력된 경우-->
						<a href="javascript:;" class="" onclick="popClose(this);return false;" role="button">삭제</a><!-- 동의클래스 confirmBtn -->
					</div>
					<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
				</div>
			</div>
		</div>
		<!-- //컨펌 팝업 -->
	</div>

</body>
</body>
</html>
