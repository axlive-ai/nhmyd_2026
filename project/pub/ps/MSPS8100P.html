	<div class="wrapper nhasset">

			<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a> <!-- [2022-12-29] 접근성 .blind 삭제 -->
		</div>
		<!-- //header -->
	
		<!-- container -->
		<div class="container">
			
		</div>

		<div class="nhasset popWrap fullLayerPop">
			<div class="popInner">

				<div class="popCont termPop p0">
					<div class="selectDivisionFlex">
						<div class="inner">
							<ul>
								<li>
									<div class="stList">
										<a href="javascript:;" title="서비스이용약관 선택팝업" onclick="slidePopOption();return false;"> 
											<span class="selectValue">2022.06.01 시행</span>
											<span class="selectBtn">버튼</span>
										</a>
										<select name="" title="선택해주세요">
											<option value=""></option>
										</select>
									</div>
								</li>
							</ul>
						</div>
					</div>

					<div class="termsWrap swiper-container prevNext swiper termContentsArea">
						<div class="swiper-wrapper">
							<div class="swiper-slide">
								<div class="termLayout">
									<div class="term_cont pt20">
										약관 내용1
									</div>
								</div>
							</div><!-- //.swiper-slide -->
							<div class="swiper-slide">

									<div class="term_cont pt20">
										약관 내용1
									</div>
								</div>
							</div><!-- //.swiper-slide -->
							
						</div>
						<div class="swiper-pagination"></div>
						<a class="swiper-button-next" href="javascript:;" tabindex="0" role="button" aria-label="다음" aria-disabled="false">다음</a>
						<a class="swiper-button-prev" href="javascript:;" tabindex="0" role="button" aria-label="이전" aria-disabled="false">이전</a>
					</div>


				</div>
				<div class="popBtnWrap">
					<div class="popBtn">
						<a href="javascript:;" class="confirmBtn" role="button">확인</a>
					</div>
					<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
				</div>
			</div>
		</div>

		<!-- 셀렉트 팝업 -->

				<!-- 팝업컨텐츠 -->
				<div class="popCont">
					<ul class="selectList">

						<li class=""><a href="javascript:;" title="2020.06.01 시행 선택하고 해당 창을 닫습니다.">2021.06.01 시행</a></li>

				</div>

				<div class="popBtnWrap">

						<a href="javascript:;" onclick="popClose(this);return false;">취소</a>
						<a href="javascript:;" class="confirmBtn">확인</a>
					</div> -->

				</div>
				<!-- // 팝업 버튼영역 -->
			</div>
		</div>
		<!-- //셀렉트 팝업 -->

	</div>
<script>
	var swiper2 = new Swiper(".termContentsArea", {
		initialSlide :0, //시작슬라이드 번호 0부터 시작
		spaceBetween: 10,
		observer: true,
		observeParents: true,
		//autoHeight : true,
		pagination: {
			el: ".swiper-pagination",
		},

		navigation: {
			nextEl: ".swiper-button-next",
			prevEl: ".swiper-button-prev",
		}
	});
</script>
