<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NH Bank">
<meta name="format-detection" content="telephone=no">
<link rel="shortcut icon" href="#">
<title>서비스 해지</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
</head>
<body>
<!-- wrapper -->
<div class="wrapper nhasset bgWhite">
	<!-- header -->
	<div class="header">
		<!-- <a href="javascript:;" class="btnBack" role="button"><span class="blind">이전화면으로</span></a> -->
		<h1><a href="javascript:;" role="text">서비스 해지</a></h1>
		<a href="javascript:;" class="btnEtc">나가기</a>
	</div>
	<!-- //header -->
	<!-- container -->
	<div class="container">
        <div class="infoBox3">
            <p class="bigTit">NH마이데이터 <strong>서비스를<br />해지하는 이유</strong>를 알려주세요</p>
        </div>
        <div class="formWrap">
            <ul>
                <li>
                    <div class="formArray mt20">
                        <span class="chkRadio">
                            <input type="radio" id="sample003" name="sample01" checked="checked">
                            <label for="sample003">다른 금융 앱을 사용하기 위해</label>
                        </span>
                    </div>
                </li>
                <li class="psbdtPoint">
                    <div class="formArray mt20">
                        <span class="chkRadio">
                            <input type="radio" id="sample004" name="sample01">
                            <label for="sample004">광고(푸시, 알림)이 번거로워서</label>
                        </span>
                    </div>
                </li>
                <li class="psbdtPoint">
                    <div class="formArray mt20">
                        <span class="chkRadio">
                            <input type="radio" id="sample005" name="sample01">
                            <label for="sample005">개인정보유출에 대한 불안 때문에</label>
                        </span>
                    </div>
                </li>
                <li class="psbdtPoint">
                    <div class="formArray mt20">
                        <span class="chkRadio">
                            <input type="radio" id="sample006" name="sample01">
                            <label for="sample006">원하는 서비스가 없어서</label>
                        </span>
                    </div>
                </li>
                <li class="psbdtPoint">
                    <div class="formArray mt20">
                        <span class="chkRadio">
                            <input type="radio" id="sample007" name="sample01">
                            <label for="sample007">서비스이용이 불편해서</label>
                        </span>
                    </div>
                </li>
                <li class="psbdtPoint">
                    <div class="formArray mt20">
                        <span class="chkRadio">
                            <input type="radio" id="sample008" name="sample01">
                            <label for="sample008">기타</label>
                        </span>
                        <textarea placeholder="해지 이유를 입력해주세요. (최대 100자)"></textarea>
                    </div>
                </li>
            </ul>
        </div>
        <div class="areaBtnDefault">
            <a href="javascript:;" class="btnPressDefault" role="button">취소</a>
            <a href="javascript:;" class="btnPressPoint" role="button">다음</a> <!-- 비활성시 disabled -->
        </div>
    </div>	
</div>
</body>
</html>
