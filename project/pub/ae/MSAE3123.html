		<div class="header">
			<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
			<h1><a href="javascript:;" role="text">VIP 금융컨설팅</a></h1>
			<a href="javascript:;" class="btnEtc">나가기</a>
		</div>
		<!-- //header -->
	
		<!-- container -->
		<div class="container">
			<div class="boxTypeWrap">
				<div class="titWrap mt0">
					<h2 class="defSubTit1">신청정보입력</h2>
				</div>
				<ul class="detailList mt20">
					<li>
						<span class="tit">이름</span>
						<span class="value">김농협</span> 
					</li>
					<li>
						<span class="tit">투자성향등급</span>
						<span class="value">위험중립형(21.08.08 까지)</span>
					</li>
					<!-- <li>
						<span class="tit">상담 유형</span>
						<span class="value">$모바일 화상상담OR영업점방문$</span>
					</li> -->
					<li>
						<span class="tit">은퇴 희망나이</span>
						<span class="value">만 55세</span> 
					</li>
					<li>
						<span class="tit">휴대폰번호</span>
						<span class="value">휴대폰번호</span> 
					</li>
				</ul>
			</div>

			<div class="boxTypeWrap overUnset pb28">
				<h2 class="defSubTit mt0">상담을 받으실 영업점은?
					<div class="tooltipWrap">
						<button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">상담을 받으실 영업점 안내 툴팁 열기</span></button>
						<div class="tooltipCont lf0">
							<p>현재 위치와 가까운 영업점을 방문하시려면 ‘가까운 영업점 찾기’를, 고객님이 원하시는 영업점이 있으시다면 ‘영업점 찾기’를 선택해 주세요.
							</p>
							<button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">툴팁 닫기</span></button>
						</div>
					</div>
				</h2>
				<p class="subTxt3">VIP 금융컨설팅 상담은 영업점을 통해 진행됩니다.</p>
				<div class="boxRadio mt20">
					<div class="boxRadioInn">
						<span>
							<input name="rdo13" id="rdo16" type="radio" checked="checked">
							<label for="rdo16">가까운 영업점 찾기</label>
						</span>
					</div>
					<div class="boxRadioInn">
						<span>
							<input name="rdo13" id="rdo17" type="radio">
							<label for="rdo17">이름으로 찾기</label>
						</span>
					</div>
				</div>
			</div>
