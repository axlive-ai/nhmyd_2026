<body>
	<div class="wrapper nhasset">
		<!-- header -->
		<div class="header">
			<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
			<h1><a href="javascript:;" role="text">VIP 금융컨설팅</a></h1>
			<a href="javascript:;" class="btnEtc">나가기</a>
		</div>
		<!-- //header -->
	
		<!-- container -->
		<div class="container">
			<div class="boxTypeWrap">
				<div class="titWrap mt0">
					<h2 class="defSubTit1">신청정보입력</h2>
				</div>
				<ul class="detailList mt20 mb5">
					<li>
						<span class="tit">이름</span>
						<span class="value">김농협</span> 
					</li>
					<li>
						<span class="tit">투자성향등급</span>
						<span class="value">위험중립형(21.08.08 까지)</span>
					</li>
					<li>
						<span class="tit">상담 유형</span>
						<span class="value">$모바일 화상상담OR영업점방문$</span>
					</li>
					<li>
						<span class="tit">은퇴 희망나이</span>
						<span class="value">만 55세</span> 
					</li>
					<li>
						<span class="tit">휴대폰번호</span>
						<span class="value">휴대폰번호</span> 
					</li>
					<li>
						<span class="tit">신청영업점</span>
						<span class="value">본점영업부</span> 
					</li>
					<li>
						<span class="tit">상담희망일</span>
						<span class="value">2020년 09월 01일 10:00</span> 
					</li>
				</ul>	
			</div>

			<div class="boxTypeWrap">
				<div class="formWrap mt5">
					<ul>
						<li>
							<strong class="formTit">원하시는 상담 종류를 선택해주세요.</strong>
							<div class="boxRadio mt8">
								<div class="boxRadioInn">
									<span>
										<input name="rdo13" id="rdo18" type="radio">
										<label for="rdo18">종합자산관리</label>
									</span>
								</div>
								<div class="boxRadioInn">
									<span>
										<input name="rdo13" id="rdo19" type="radio">
										<label for="rdo19">세무</label>
									</span>
								</div>
							</div>
							<div class="boxRadio mt8">
								<div class="boxRadioInn">
									<span>
										<input name="rdo13" id="rdo20" type="radio">
										<label for="rdo20">부동산</label>
									</span>
								</div>
								<div class="boxRadioInn">

								</div>
							</div>
						</li>
						<li class="borderTop mt25">
							<strong class="formTit mt25">상담내용</strong>
							<textarea name="" id="" title="상담내용" placeholder="상담 받을 내용을 입력해 주세요."></textarea>
							<p class="ar subTxt2">0/60</p>
						</li>
					</ul>
				</div>
			</div>

			<div class="areaBtnDefault">
				<a href="javascript:;" class="btnPressDefault" role="button">이전</a>
				<a href="javascript:;" class="btnPressPoint" role="button">신청</a> <!-- 비활성화시 disabled 추가 -->
			</div>
		</div>
		<!-- //container -->

	</div>
