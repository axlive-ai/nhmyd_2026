<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NH Bank">
<meta name="format-detection" content="telephone=no">
<link rel="shortcut icon" href="#">
<title>기본정보</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function () {
		//tostpop();//토스트 팝업 호출 
	})

	function tostpop(){
		var $tostCont = '<div class="tostpopupWrap" aria-live="assertive"><div class="tostMsg">업데이트를 완료했습니다.</div></div>'
		$('.container').after($tostCont);
		setTimeout(function(){
			$('.tostpopupWrap').remove();
		},4000)
	}
</script>
</head>
<body>
<!-- wrapper -->
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack" role="button"><span>Back</span></a>
		<h1>기본정보</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav" role="button"><span>Menu</span></a>
	</div>
	<!-- //header -->
	<!-- container -->
	<div class="container">

		<div class="formWrap boxTypeWrap pb30">
			<div class="yatexinfoWrap">
				<h2 class="defTit">연말정산을 시작하려면<br><strong>기본정보가 필요해요</strong></h2><!--09.19 수정-->
				<div class="yearimgBg">
					<span class="blind">연말정산 기본정보 이미지</span>
				</div>
			</div>

			<div class="yeartexForm mt0"><!--08.22 mt40울 mt0으로 수정-->
				<strong class="formTit disInline">올해의 연봉은 얼마인가요?</strong>
				<div class="tooltipWrap w96">
					<button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">올해의 연봉 툴팁 열기</span></button>
					<div class="tooltipCont">
						<p>총급여는 국세청에서 수집된 건강보험료(직장)조회 기준으로 3개월 평균 보수 월액을 기준으로 추정된 금액입니다.
							</p>
						<button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">툴팁 닫기</span></button>
					</div>
				</div>
				<button type="button" class="contBtn02">연결하기</button>
				<p class="addtxt">(약 7,000만원)</p><!--08.22 추가-->
				<div class="inputList error"> <!--error인 경우 추가-->
					<input type="tel" title="올해의 연봉" name="" id="" value="" placeholder=" ">
					<span class="unit">원</span>
					<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
				</div>
				<p class="errorTxt">1원 이상 입력해주세요</p><!--08.18 텍스트 수정-->
			</div>

			<div class="yeartexForm addbdTop">
					<strong class="formTit disInline mt30">소유하신 주택이 있나요?</strong>
					<div class="tooltipWrap w96">
						<button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">소유하신 주택 툴팁 열기</span></button>
						<div class="tooltipCont">
							<p>주택보유 유형은 주택청약 등 환급 받을 수 있는 금액에 활용되어 더 정확한 금액을 제공 할 수 있습니다.
								</p>
							<button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">툴팁 닫기</span></button>
						</div>
					</div>
				<div class="boxRadio">
					<div class="boxRadioInn">
						<span>
							<input name="rdo01" id="rdo01" type="radio" checked="checked">
							<label for="rdo01">무주택</label>
						</span>
					</div>
					<div class="boxRadioInn">
						<span>
							<input name="rdo01" id="rdo02" type="radio">
							<label for="rdo02">1주택</label>
						</span>
					</div>
					<div class="boxRadioInn">
						<span>
							<input name="rdo01" id="rdo03" type="radio">
							<label for="rdo03">2주택 이상</label>
						</span>
					</div>
				</div>
			</div>

		</div>

		<div class="areaBtnDefault">
			<a href="javascript:;" class="btnPressNone" role="button">저장하기</a> <!--08.18 수정--> <!--활성화 class btnPressPoint --->
		</div>
	</div>
</div>

</body>
</html>
