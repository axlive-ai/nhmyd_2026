<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NH Bank">
<meta name="format-detection" content="telephone=no">
<link rel="shortcut icon" href="#">
<title>혜택플러스</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
</head>
<body>
	<div class="wrapper nhasset">
		<!-- header -->
		<div class="header">
			<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
			<h1><a href="javascript:;" role="text">혜택플러스</a></h1>
			<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
			<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a> <!-- [2022-12-29] 접근성 .blind 삭제 -->
		</div>
		<!-- //header -->
	
		<!-- container -->
		<div class="container">
			<div class="boxTypeWrap">
				<div class="quizTitArea">
                    <h2 class="defTit mt0"><strong>NH마이데이터<br>OX퀴즈 미션</strong></h2>
                    <p class="quizDate">22.05.07 ~ 22.05.14</p>
                </div>
				<!-- 이미지 있을 경우 노출 -->
				<div class="quizImg">
					<img src="../../images/contents/bg_quiz_img01.png" alt="올리">
				</div>
				<!-- //이미지 있을 경우 노출 -->
				<div class="quizQsArea">
					<p class="qsTxt"><strong class="qsNum">Q.</strong>태풍이란 북태평양서부에서 발생하는 열대 저기압 중에서 중심 부근의 최대 풍속이 17m/s 이상으로 강한 폭풍우를 동반하는 자연현상을 말한다.</p>
					<strong class="tag mint mt10">50P</strong>
				</div>
			</div>
            <ul class="quizAnswer">
                <li>
                    <input type="radio" id="selYes01" name="selAnswer" aria-label="o" checked="">
                    <label for="selYes01" aria-hidden="true"></label>
                </li>
                <li>
                    <input type="radio" id="selNo01" name="selAnswer" aria-label="x">
                    <label for="selNo01" aria-hidden="true"></label>
                </li>
            </ul>
			<div class="areaBtnDefault">
				<a href="javascript:;" class="btnPressPoint" role="button">답변 제출</a>
			</div>
		</div>
		<!-- //container -->

	</div>

</body>
</html>
