<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NH Bank">
<meta name="format-detection" content="telephone=no">
<link rel="shortcut icon" href="#">
<title>헬스케어</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
</head>
<body>
<!-- wrapper -->
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack" role="button"><span>Back</span></a>
		<h1>비만</h1> <!-- [2022-11-11] 타이틀 수정 -->
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav" role="button"><span>Menu</span></a>
	</div>
	<!-- //header -->
	<!-- container -->
	<div class="container">
        <h2 class="defTit icoHtNews">
            <strong>검색하신 뉴스</strong>를<br>확인해 보세요<br>
            <a href="javascript:;" class="linkTxt3" role="button">검색하기</a>
        </h2>

        <!-- 검색결과 있을 경우// -->
        <!-- [2022-12-06] 배너 수정 -->
        <div class="htSubMainBanner">
            <div class="yabannerArea">
                <a href="javascript:;" title="">
                    <div class="yabanner" style="background-image:url('../../images/banner/bg_ht_obj01.png');">
                        <span class="subTxt"><strong>비만</strong></span>
                        <p class="subTit"><strong>초절식 다이어트가<br>위험한 이유</strong></p>
                        <div class="tagWrap"><span class="tag text">#다이어트</span><span class="tag text">#초절식</span></div>
                    </div>
                </a>
            </div>
            <div class="yabannerArea">
                <a href="javascript:;" title="">
                    <div class="yabanner" style="background-image:url('../../images/banner/bg_ht_obj02.png');">
                        <span class="subTxt"><strong>비만</strong></span>
                        <p class="subTit"><strong>다이어트 속설의<br>진실과 오해</strong></p>
                        <div class="tagWrap"><span class="tag text">#다이어트</span><span class="tag text">#운동</span></div>
                    </div>
                </a>
            </div>
            <div class="yabannerArea">
                <a href="javascript:;" title="">
                    <div class="yabanner" style="background-image:url('../../images/banner/bg_ht_obj03.png');">
                        <span class="subTxt"><strong>비만</strong></span>
                        <p class="subTit"><strong>다이어트 실패 주범!<br>공복 호르몬 극복하려면?</strong></p>
                        <div class="tagWrap"><span class="tag text">#다이어트</span><span class="tag text">#호르몬</span></div>
                    </div>
                </a>
            </div>
        </div>
        <!-- //[2022-12-06] 배너 수정 -->
        <!-- <div style="background:cyan;height:1000px">스크롤테스트 용 DIV</div> -->
        <button type="button" class="goTopBtn"><span class="blind">최상단으로 이동</span></button>
        <!-- //검색결과 있을 경우 -->

        <!-- 검색결과 없을 경우// -->
        <div class="nolistBox">
            <div class="noResultWrap"><p>검색 결과가 없습니다.</p></div>
        </div>
        <h2 class="txtt2 mt30">다양한 건강카드뉴스를 만나보세요</h2>
        <!-- 랜덤 배너 : htSubMainBanner -->
        <!-- [2022-12-06] 배너 수정 -->
        <div class="htSubMainBanner">
            <div class="swiper-container">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <div class="yabannerArea">
                            <a href="javascript:;" title="">
                                <div class="yabanner" style="background-image:url('../../images/banner/bg_ht_obj01.png');">
                                    <span class="subTxt"><strong>비만</strong></span>
                                    <p class="subTit"><strong>초절식 다이어트가<br>위험한 이유</strong></p>
                                    <div class="tagWrap"><span class="tag text">#다이어트</span><span class="tag text">#초절식</span></div>
                                </div>
                            </a>
                        </div>
                    </div>
                    <div class="swiper-slide">
                        <div class="yabannerArea">
                            <a href="javascript:;" title="">
                                <div class="yabanner" style="background-image:url('../../images/banner/bg_ht_obj02.png');">
                                    <span class="subTxt"><strong>식품</strong></span>
                                    <p class="subTit"><strong>과일주스VS콜라,<br>치아 건강에 더 안 좋은 것은?</strong></p>
                                    <div class="tagWrap"><span class="tag text">#치아</span><span class="tag text">#치아관리</span></div>
                                </div>
                            </a>
                        </div>
                    </div>
                    <div class="swiper-slide">
                        <div class="yabannerArea">
                            <a href="javascript:;" title="">
                                <div class="yabanner" style="background-image:url('../../images/banner/bg_ht_obj03.png');">
                                    <span class="subTxt"><strong>비만</strong></span>
                                    <p class="subTit"><strong>다이어트 실패 주범!<br>공복 호르몬 극복하려면?</strong></p>
                                    <div class="tagWrap"><span class="tag text">#다이어트</span><span class="tag text">#호르몬</span></div>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="swiper-control">
                    <div class="swiper-pagination"></div>
                    <div class="swiper-autoBtn playing">
						<a href="javascript:;" class="stopBtn" title="자동재생중 두번 터치시 멈춤"></a>
						<a href="javascript:;" class="playBtn" title="자동재생 멈춤 두번 터치시 자동재생시작"></a>
					</div>
                </div>
            </div>
            <script>
                $(function () {
                    var swiper = new Swiper('.htSubMainBanner .swiper-container', {
                        spaceBetween: 20,
                        autoplay: {
							delay: 2500,
							disableOnInteraction: true,
							pauseOnMouseEnter: true,
						},
                        pagination: {
                            el: '.swiper-pagination',
                            type: 'bullets',
                            clickable: true,
                            bulletElement: 'a',
                        },
                        on: {
                            init: function(){
                                $('.htSubMainBanner .swiper-slide').attr('aria-hidden','true');
                                $('.htSubMainBanner .swiper-slide-active').attr('aria-hidden','false');
                            },
                            slideChangeTransitionEnd : function(){
                                var $shareBannerBtn = $(".htSubMainBanner .swiper-pagination");
                                $shareBannerBtn.find("a").attr('title','');
                                $shareBannerBtn.find("a").eq(this.activeIndex).attr('title','선택됨');
                                $('.htSubMainBanner .swiper-slide').attr('aria-hidden','true');
                                $('.htSubMainBanner .swiper-slide-active').attr('aria-hidden','false');
                            }
                        }
                    });
                    $('.htSubMainBanner').find('.stopBtn').on('click', function () {
						$('.htSubMainBanner .swiper-autoBtn').removeClass('playing');
						swiper.autoplay.stop();
						console.log('자동재생 멈춤');
					})
					$('.htSubMainBanner').find('.playBtn').on('click', function () {
						$('.htSubMainBanner .swiper-autoBtn').addClass('playing');
						swiper.autoplay.start();
						console.log('자동재생 시작');
					})
                })
            </script>
        </div>
        <!-- //[2022-12-06] 배너 수정 -->
        <!-- //랜덤 배너 : htSubMainBanner -->

        <!-- <div style="background:cyan;height:1000px">스크롤테스트 용 DIV</div> -->
        <button type="button" class="goTopBtn"><span class="blind">최상단으로 이동</span></button>
        <!-- //검색결과 없을 경우 -->
        
	</div>
</div>

</body>
</html>
