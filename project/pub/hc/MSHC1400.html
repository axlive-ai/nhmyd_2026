<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="title" content="">

<meta name="description" content="농협자산관리">

<meta http-equiv="Expires" content="-1">
<title>비교상품상세</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
	<div class="wrapper nhasset">
		<!-- header -->
		<div class="header">
			<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
			<h1><a href="javascript:;" role="text">청각</a></h1>
			<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
			<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a> <!-- [2022-12-29] 접근성 .blind 삭제 -->
		</div>
		<!-- //header -->
	
		<!-- container -->
		<div class="container">
			
			<div class="boxTypeWrap healthBox"> <!-- [2023-02-23] healthBox 클래스 추가 -->
				<h2 class="defSubTit2 containTooltip"><strong class="bold">내 검진결과 비교</strong>
					<div class="tooltipWrap">
						<button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">그래프 구간안내 설명 툴팁</span></button>
						<div class="tooltipCont">
							<p>최근 검사일 기준 직전년도 결과 비교 제공</p>
							<button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">툴팁 닫기</span></button>
						</div>
					</div>
				</h2>
                <h3 class="defSubTit3 mt20">청각 (좌/우)</h3>
                <ul class="detailList mt20">
                    <li>
                        <strong class="tit">2021</strong>
                        <strong>
                            <span class="value">정상/정상</span>
                        </strong>
                    </li>
                    <li>
                        <strong class="tit">2016</strong>
                        <strong>
                            <span class="value">정상/정상</span>
                        </strong>
                    </li>
                    <li>
                        <strong class="tit">2013</strong>
                        <strong>
                            <span class="value">정상/정상</span>
                        </strong>
                    </li>
                </ul>
			</div>

			<!-- <div class="areaBtnDefault">
				<a href="javascript:;" class="btnPressPoint" role="button">확인</a>
			</div> -->
		</div>
		<!-- //container -->
	</div>
	<script type="text/javascript">
		$('.scAreaWrap a.active').each(function(){
			var $this = $(this);
			var $thisPos = $this.offset().left;
			var $wrap = $this.closest('.scAreaWrap').scrollLeft();
			$this.closest('.scAreaWrap').stop().animate({scrollLeft:$wrap + $thisPos - 16 },300);
		});
		$('.scAreaWrap a').on('click focus',function(e){
			var $this = $(this);
			var $thisPos = $this.offset().left;
			var $wrap = $this.closest('.scAreaWrap').scrollLeft();
			$this.closest('.scAreaWrap').stop().animate({scrollLeft:$wrap + $thisPos - 16 },300);	
		});

		$('.maybeWishList > li > a').click(function(){
			$(this).closest('.maybeWishList').find('a').removeClass('active');
			$(this).addClass('active');
		});
	</script>
</body>
</html>
