<div class="nhasset popWrap fullLayerPop" role="dialog">

					</li>

			</div>

			<div class="searchResultWrap type02">
				<ul class="searchResultList">
					<li>
						<a href="javascript:;" role="button">

							<span class="subTxt">16006 (16006)</span>
						</a>
					</li>
				</ul>
			</div>

			<div class="noResultWrap">
				<p>검색 결과가 없습니다.</p>
			</div>

		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn disabled" role="button" aria-disabled="true">확인</a> <!-- [2023-01-16] 접근성 수정 -->
				<a href="javascript:;" class="confirmBtn" style="display:none;margin:0 !important" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<script type="text/javascript">
	$('.searchResultList a').click(function(){
		var $this = $(this);
		$this.closest('.searchResultList').find('li').removeClass('active')
		$this.closest('li').addClass('active')
	});

</script>
