<script type="text/javascript">
	//달력 스와이프
	var swiper = new Swiper(".calenderInfoWrap", {
		spaceBetween: 10,
		slidesPerView: 1,
		observer: true,
		observeParents: true,
		effect: "fade",
		touchRatio: 0,	//touch move 비활성
		freeMode: true,
		watchSlidesProgress: true,
		
	});
	var swiper2 = new Swiper(".dateItemWrap", {
		initialSlide :0, //시작슬라이드 번호 0부터 시작
		spaceBetween: 10,
		observer: true,
		observeParents: true,
		autoHeight : true,
		pagination: {
			el: ".swiper-pagination",
		},

		//pagination:false,
		navigation: {
			nextEl: ".btn-month-next",
			prevEl: ".btn-month-prev",
		},
		thumbs: {
			swiper: swiper,
		},
	});

	//달력 폴딩
	$('.carandarFolding').click(function(){
		var  $this = $(this);
		var $target = $this.closest('.wrapCalender').find('.calenderArea');
		$this.toggleClass('active');
		if ($this.hasClass('active')) {
			$target.slideDown();
			$this.children('span').text('달력 접기');
			$this.attr('aria-expanded','true');
			$('.weekItem span:first-child').focus();
		}else{
			$target.slideUp();
			$this.children('span').text('달력 열기');
			$this.attr('aria-expanded','false');
		}
	});

	//내역으로 이동
	$('.date').click(function(){
		var $this = $(this);
		var $thisDate = $this.attr('data-day-select');
		console.log($thisDate)
		$('.dataDayDetail').each(function(){
			var $thisTarget = $(this);
			var $targetPo = $(this).offset().top;
			if ($(this).attr('data-day-detail') == $thisDate) {
				$('html, body').stop().animate({scrollTop:$targetPo - 50},400,function(){
					$thisTarget.focus()
				});

			}

		});

		// var $targetPo = $('#posTarget').offset().top;
		// $('html,body').animate({ scrollTop: $targetPo - 50 }, 300);
	});
</script>
