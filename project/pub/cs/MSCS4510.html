<body>
	<div class="wrapper nhasset">
		<!-- header -->
		<div class="header">
			<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
			<h1><a href="javascript:;" role="text">카드혜택비교</a></h1>
			<!-- <a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
			<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>  -->
		</div>
		<!-- //header -->
	
		<!-- container -->
		<div class="container">
			
		</div>
		<!-- //container -->
	</div>
	<div class="dataLoadingWrap">
		<div class="dataLoading">
			<div class="inner cardBenefit"><p>잠시만 기다려주세요!<br>열심히 카드혜택을 확인하고 있어요</p></div>
		</div>
	</div>

	<script type="text/javascript">
		//로딩 영역 보이기
		function dataLoadingShow(){
			$('.dataLoadingWrap').show();
			$('body').addClass('hasLoading');
			$('.container').attr('aria-hidden','true')
		}

		//로딩 영역 감추기
		function dataLoadingHide(){
			$('.dataLoadingWrap').hide();
			$('body').removeClass('hasLoading');
			$('.container').attr('aria-hidden','false')
		}
		dataLoadingShow()
	</script>
</body>
